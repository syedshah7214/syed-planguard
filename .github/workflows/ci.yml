name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine & API · lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (coverage gate 85%)
        run: pytest --cov --cov-report=term --cov-fail-under=85
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  dashboard:
    name: Dashboard · lint, build, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  real-terraform-plans:
    name: Real terraform plans · PlanGuard must PASS secure and FAIL insecure
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Plan both examples (placeholder credentials, no AWS account)
        run: |
          for d in secure insecure; do
            terraform -chdir=examples/terraform/$d init -input=false -no-color
            terraform -chdir=examples/terraform/$d plan -input=false -no-color -refresh=false -out tfplan
            terraform -chdir=examples/terraform/$d show -json tfplan > plan-$d.json
          done
      - name: Secure plan must not FAIL
        uses: ./
        with:
          plan-file: plan-secure.json
          title: "examples/terraform/secure"
      - name: Insecure plan must FAIL
        run: |
          if PYTHONPATH=backend python -m planguard plan-insecure.json --title "examples/terraform/insecure" --summary; then
            echo "::error::PlanGuard should have failed the insecure plan"; exit 1
          fi
          echo "PlanGuard correctly blocked the insecure plan."

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
